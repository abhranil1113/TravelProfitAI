[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tbo-inventoryiq"
version = "0.1.0"
description = "AI-Powered Travel Inventory & Profit Optimization Platform"
authors = [{ name = "Abhranil Pal" }]
requires-python = ">=3.10"
readme = "README.md"
dependencies = [
    "pandas>=2.2.0,<3.0.0",
    "numpy>=1.26.0,<3.0.0",
    "pyarrow>=15.0.0",
    "openpyxl>=3.1.0",
    "ortools>=9.10.0",
    "scikit-learn>=1.4.0",
    "scipy>=1.12.0",
    "xgboost>=2.0.0",
    "lightgbm>=4.0.0",
    "joblib>=1.3.0",
    "pandera>=0.20.0",
    "pydantic>=2.7.0,<3.0.0",
    "pydantic-settings>=2.3.0",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.0",
    "fastapi>=0.111.0",
    "uvicorn>=0.30.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ipython>=8.20.0",
    "ipykernel>=6.29.0",
    "ipywidgets>=8.1.0",
]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q"
pythonpath = ["."]
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]
