[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tbo-inventoryiq"
version = "0.1.0"
description = "AI-Powered Travel Inventory & Profit Optimization Platform"
authors = [{ name = "Abhranil Pal" }]
requires-python = ">=3.10"
readme = "README.md"

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q"
pythonpath = ["."]
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]
